<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Music Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-container">
        <video id="bg-video" autoplay loop muted playsinline>
            <source src="bg-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="overlay"></div>
        <div id="flash-overlay"></div>
        <canvas id="particles-canvas"></canvas>
    </div>

    <div class="main-container">
        <div class="visualizer-wrapper">
            <canvas id="visualizer"></canvas>
            <div class="center-image-container">
                <!-- Using a placeholder if circle_pulse.png is not found yet -->
                <img src="circle_pulse.png" alt="Center Pulse Image" id="center-image" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23555\'/></svg>'">
            </div>
        </div>
        
        <div class="controls">
            <button id="start-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                START MIC
            </button>
            <button id="fullscreen-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            </button>
        </div>
        <div class="intensity-bar-container">
            <div class="intensity-track">
                <div class="intensity-fill" id="intensity-fill"></div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
